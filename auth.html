<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitch Auth Redirect</title>
</head>
<body>
  <script>
    // Twitch sends the access token in the URL hash (#access_token=...)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get("access_token");

    if (accessToken && window.opener) {
      window.opener.postMessage({ access_token: accessToken }, window.location.origin);
      window.close();
    } else {
      document.body.textContent = "Login failed or popup blocked.";
    }
  </script>
</body>
</html>
